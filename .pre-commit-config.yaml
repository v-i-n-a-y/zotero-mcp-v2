# House hooks from v-i-n-a-y/pre-commits, plus the Zotero-specific guards.
ci:
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/v-i-n-a-y/pre-commits
    rev: v0.9.0
    hooks:
      - id: copyright-check
        args: [--holder, "Vinay"]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-endings
      - id: no-commit-to-branch
      - id: no-em-dash
      - id: detect-secrets
      - id: gitignore-shadow-check
      - id: conventional-commit
        stages: [commit-msg]
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py310-plus]

  # pytest-run and coverage-check from the hook repo above run inside
  # pre-commit's own isolated virtualenv, where zotero_mcp is not installed,
  # and additional_dependencies paths resolve against the *hook* repository
  # rather than this one. Running them against the working environment is
  # also what you want locally: the tests should exercise the interpreter you
  # develop in, not a synthetic one.
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest -q
        language: system
        types: [python]
        pass_filenames: false
      - id: coverage
        name: coverage (min 85%)
        entry: python -m pytest -q --cov=zotero_mcp --cov-fail-under=85 --cov-report=term:skip-covered
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: check-added-large-files
        # The vendored Zotero schema is the largest thing that legitimately
        # ships; anything appreciably bigger is an accident.
        args: [--maxkb=256]
